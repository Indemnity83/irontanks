# Increase memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with the configuration cache (see fabric-loom#1349).
org.gradle.configuration-cache=false

# Mod Properties
maven_group=com.indemnity83.irontanks
archives_base_name=irontanks
mod_id=irontanks

# Minecraft
minecraft_version=26.1.2
# Half-open compatibility range as exactly "<min>,<next>" with no spaces; min inclusive, next exclusive.
minecraft_compatibility_versions=26.1.2,26.2
java_version=25

# Fabric — check versions at https://fabricmc.net/develop
fabric_loader_version=0.18.6
fabric_version=0.145.2+26.1.1
loom_version=1.16-SNAPSHOT

# NeoForge — check versions at https://projects.neoforged.net/neoforged/neoforge
# Recommended pairing per neoforged.net: MC 26.1.2 -> 26.1.2.71 (26.1.1 -> 26.1.1.15-beta,
# 26.1 -> 26.1.0.19-beta). Keep this in sync with minecraft_version above.
neoforge_version=26.1.2.71
neoforge_loader_version_range=[4,)
neo_form_version=26.1.2-1
moddev_version=2.0.141

# Test Dependencies
junit_version=5.11.0
assertj_version=3.26.0
