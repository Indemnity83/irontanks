# Increase memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with the configuration cache (see fabric-loom#1349).
org.gradle.configuration-cache=false

# Mod Properties
maven_group=com.indemnity83.irontanks
archives_base_name=irontanks
mod_id=irontanks

# Minecraft
minecraft_version=26.1.2
# Half-open compatibility range as exactly "<min>,<next>" with no spaces; min inclusive, next exclusive.
minecraft_compatibility_versions=26.1.2,26.2
java_version=25

# Fabric — check versions at https://fabricmc.net/develop (must match minecraft_version)
fabric_loader_version=0.19.2
fabric_version=0.150.0+26.1.2
loom_version=1.16-SNAPSHOT

# NeoForge — check versions at https://projects.neoforged.net/neoforged/neoforge
# Recommended pairing per neoforged.net: MC 26.1.2 -> 26.1.2.71 (26.1.1 -> 26.1.1.15-beta,
# 26.1 -> 26.1.0.19-beta). Keep this in sync with minecraft_version above.
neoforge_version=26.1.2.71
neoforge_loader_version_range=[4,)
neo_form_version=26.1.2-1
moddev_version=2.0.141

# Crash reporting (Sentry). sentry_version = runtime SDK (bundled per loader); sentry_gradle_version =
# the io.sentry.jvm.gradle source-context plugin. gson/log4j are provided by Minecraft at runtime —
# pinned here only so core compiles/tests against the same versions MC 26.1 ships.
sentry_version=8.16.0
sentry_gradle_version=5.8.0
gson_version=2.13.2
log4j_version=2.25.2
slf4j_version=2.0.17

# Test Dependencies
junit_version=5.11.0
assertj_version=3.26.0
# JaCoCo 0.8.14 is the first release with official Java 25 (class major v69) support.
jacoco_version=0.8.14

# Jade — optional HUD integration, compile-only. Only takes effect if the player installs Jade; the
# mod loads and works fine without it. Versions support MC 26.1.2 (see modrinth.com/mod/jade/versions).
jade_neoforge_version=26.1.1+neoforge
jade_fabric_version=26.1.0+fabric

# Logistics — optional integration. Compile-only against the published logistics mod from the Modrinth
# maven (the same artifact players install supplies these API classes at runtime). The loader suffix
# (.neoforge / .fabric) is appended in each build.gradle. Bump when targeting a newer logistics release.
logistics_version=0.7.3+mc26.1

# Code formatting (Spotless: palantir-java-format for Java, gson for JSON)
spotless_version=8.6.0
palantir_version=2.91.0
