modLoader="javafml"
loaderVersion="${neoforge_loader_version_range}"
license="MIT"
issueTrackerURL="https://github.com/Indemnity83/irontanks/issues"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="Iron Tanks"
description='''
Tiered-capacity and special-purpose fluid tanks.
'''
authors="Kyle Klaus (@indemnity83)"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neoforge_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${neoforge_minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Optional cross-mod tank integration: iron tanks stack and share fluid with logistics tanks, and
# iron upgrade items work on the logistics glass tank. Iron Tanks works fully without logistics.
[[dependencies.${mod_id}]]
modId="logistics"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"
