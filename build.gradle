buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

// Build settings come from gradle.properties and are available as project properties:
// minecraft_version, forge_version, mappings, java_version, buildcraft_version.

// Version is injected by release CI via the MOD_VERSION env var (e.g. "2.2.0+mc1.12.2").
// Local/dev builds get a static marker — released versions come from release-please.
version = System.getenv("MOD_VERSION") ?: "dev-local"
group = "com.indemnity83.irontanks"
archivesBaseName = "irontanks"

sourceCompatibility = targetCompatibility = project.java_version
compileJava {
    sourceCompatibility = targetCompatibility = project.java_version
}

minecraft {
    version = "${project.minecraft_version}-${project.forge_version}"
    mappings = project.mappings
    runDir = "run"

    // replacing stuff in the source
    replace "\${version}", project.version
    replace "\${mcversion}", version
    // Replace @Mod.acceptedMinecraftVersions specially as it has to be a valid version in a dev environment :/
    replace "(gradle_replace_mcversion,)", "[" + version + "]"
    replace "(gradle_replace_forgeversion,)", "[" + project.forge_version + ",)"
    replace "(gradle_replace_buildcraftversion,)", "[" + project.buildcraft_version + ",)"
}

repositories {
    maven {
        name "BuildCraft"
        url "https://mod-buildcraft.com/maven"
    }
}

dependencies {
    // BuildCraft is an OPTIONAL runtime integration, not a requirement. We compile against it (its
    // public API is also vendored under src/main/java/buildcraft/api so the mod still loads when
    // BuildCraft is absent), but ForgeGradle never bundles dependencies into our jar. The @Mod
    // dependency is "after:" rather than "required-after:", so the mod runs with or without it.
    deobfProvided "com.mod-buildcraft:buildcraft:" + project.buildcraft_version
}

processResources
{
    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'

        // replace version and mcversion
        // ${version}   and    ${mcversion}    are the exact strings being replaced
        expand "version":project.version, "mcversion":project.minecraft.version
    }

    // copy everything else, that's not the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

// Forge's run tasks have no real outputs, so Gradle can wrongly cache them as "up-to-date" after a
// successful launch and silently skip the next run. Always re-run them so `runClient`/`runServer` work.
afterEvaluate {
    ['runClient', 'runServer'].each { n ->
        tasks.findByName(n)?.outputs?.upToDateWhen { false }
    }
}
