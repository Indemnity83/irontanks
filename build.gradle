buildscript {
    repositories {
        jcenter()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:6.0.53'
    }
}

apply plugin: 'forge'

// NOTE: This 1.7.10 build still uses ForgeGradle 1.2, whose Minecraft download URLs
// (s3.amazonaws.com/Minecraft.Download/...) are decommissioned, so `:downloadClient`
// currently fails. The repo automation below is modernized; getting the build green
// requires migrating to RetroFuturaGradle (tracked separately).

// Build settings come from gradle.properties and are available as project properties:
// minecraft_version, forge_version, buildcraft_version.

// Version is injected by release CI via the MOD_VERSION env var (e.g. "1.2.0+mc1.7.10").
// Local/dev builds get a static marker — released versions come from release-please.
version = System.getenv("MOD_VERSION") ?: "dev-local"
group = "com.indemnity83.irontanks"
archivesBaseName = "irontanks"

minecraft {
    version = "${project.minecraft_version}-${project.forge_version}"
    runDir = "run"

    // replacing stuff in the source
    replace "\${version}", project.version
    replace "\${mcversion}", version
    replace "(gradle_replace_mcversion,)", "[" + version + "]"
    replace "(gradle_replace_forgeversion,)", "[" + project.forge_version + ",)"
}

repositories {
    ivy {
        name "BuildCraft"
        artifactPattern "https://www.mod-buildcraft.com/releases/BuildCraft/[revision]/[module]-[revision]-[classifier].[ext]"
    }
}

dependencies {
    compile name: "buildcraft", version: project.buildcraft_version, classifier: "dev"
}

processResources
{
    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'

        // replace version and mcversion
        // ${version}   and    ${mcversion}    are the exact strings being replaced
        expand "version":project.version, "mcversion":project.minecraft.version
    }

    // copy everything else, that's not the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
