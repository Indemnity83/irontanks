// Root of the Iron Tanks multiloader project for Minecraft 26.1.
//
// Architecture: a pure-logic `core` module (no Minecraft on its classpath) holds the tank tiers,
// fluid-stacking math, void rate and upgrade rules; the `fabric` and `neoforge` modules each provide
// their own thin Minecraft glue and depend on `core`. See the plan and CLAUDE.md for the rationale.

plugins {
    id 'com.diffplug.spotless'
}

allprojects {
    group = rootProject.maven_group
    // Version is injected by release CI via MOD_VERSION; local/dev builds get a static marker.
    // The marker must be SemVer: NeoForge's FML rejects a version without a leading numeric component at
    // load time (a bare "dev-local" throws InvalidModFileException "Illegal version number specified
    // dev-local" — verified via :neoforge:runServer). "0.0.0-dev-local" keeps FML happy while still
    // reading as clearly unversioned. Single source of truth — the loader modules inherit this.
    version = System.getenv("MOD_VERSION") ?: "0.0.0-dev-local"
}

// Spotless resolves its formatter (palantir-java-format) from the root project's repositories.
repositories {
    mavenCentral()
}

// Formatting is enforced once at the root across all modules (no per-subproject duplication):
// `./gradlew spotlessApply` to fix, `./gradlew spotlessCheck` is the CI lint gate.
spotless {
    java {
        target 'core/src/**/*.java', 'fabric/src/**/*.java', 'neoforge/src/**/*.java'
        palantirJavaFormat("${palantir_version}")
        removeUnusedImports()
        // palantir-java-format emits 4-space indentation and trims/ends files to match .editorconfig.
    }
    json {
        target 'resources/**/*.json',
               'fabric/src/main/resources/**/*.json',
               'neoforge/src/main/resources/**/*.json'
        gson().indentWithSpaces(2)
    }
}

// Gson, Log4j2 and SLF4J come from Minecraft at runtime; `core` only pins them (gradle.properties) so
// its crash handler can compile and be unit-tested. Nothing links those pins in a shipped jar, so a pin
// that drifts from what Minecraft actually forces is invisible to every CI job until a moved signature
// throws NoSuchMethodError — inside the crash handler, turning a reportable crash into a secondary one.
// `checkMinecraftLibraryPins` re-reads the versions each loader's compile classpath resolves and fails
// when a pin no longer matches. It walks the dependency graph only (metadata, no artifact downloads) on
// a configuration the loader already resolves in order to compile, so it costs nothing extra next to
// :<loader>:jar. Keys are exactly the coordinates core declares in its dependencies block.
def minecraftProvidedPins = [
    'com.google.code.gson:gson'          : 'gson_version',
    'org.apache.logging.log4j:log4j-core': 'log4j_version',
    'org.slf4j:slf4j-api'                : 'slf4j_version',
]

configure([project(':fabric'), project(':neoforge')]) {
    tasks.register('checkMinecraftLibraryPins') {
        group = 'verification'
        description = 'Fails when a gradle.properties pin drifts from the version Minecraft forces onto this loader\'s compile classpath.'
        doLast {
            var resolved = [:]
            configurations.compileClasspath.incoming.resolutionResult.allComponents { component ->
                var id = component.moduleVersion
                if (id != null) {
                    resolved["${id.group}:${id.name}".toString()] = id.version
                }
            }
            var problems = minecraftProvidedPins.collect { coordinate, property ->
                var pinned = rootProject.property(property)
                var actual = resolved[coordinate]
                if (actual == null) {
                    return "${coordinate} is pinned as ${property}=${pinned} but is not on the ${project.name} " +
                            "compile classpath at all — Minecraft no longer supplies it, so drop the pin and core's " +
                            "dependency on it, or bundle the library deliberately."
                }
                if (actual != pinned) {
                    return "${coordinate} resolves to ${actual} on the ${project.name} compile classpath but " +
                            "gradle.properties pins ${property}=${pinned} — update the pin to ${actual}."
                }
                return null
            }.findAll()
            if (problems) {
                throw new GradleException(
                        "Minecraft-provided library pins are stale:\n  " + problems.join('\n  '))
            }
        }
    }

    // Runs as part of `check`/`build` locally; CI invokes it explicitly alongside :<loader>:jar.
    plugins.withId('java') {
        tasks.named('check') { dependsOn 'checkMinecraftLibraryPins' }
    }
}
