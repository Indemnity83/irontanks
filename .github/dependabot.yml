version: 2
updates:
  # --- mc/1.12.2 ---
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "mc/1.12.2"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    ignore:
      # ForgeGradle is pinned to a 2.3 -SNAPSHOT; FG3+ dropped the
      # 'net.minecraftforge.gradle.forge' plugin id this build uses.
      - dependency-name: "net.minecraftforge.gradle:ForgeGradle"
      # FG2 relies on Gradle APIs removed in Gradle 5 (and this builds on JDK8).
      - dependency-name: "gradle-wrapper"
        versions: [">=5.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "mc/1.12.2"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"

  # --- mc/1.11.2 ---
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "mc/1.11.2"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    ignore:
      # ForgeGradle is pinned to a 2.2 -SNAPSHOT; FG3+ dropped the
      # 'net.minecraftforge.gradle.forge' plugin id this build uses.
      - dependency-name: "net.minecraftforge.gradle:ForgeGradle"
      # FG2 relies on Gradle APIs removed in Gradle 5 (and this builds on JDK8).
      - dependency-name: "gradle-wrapper"
        versions: [">=5.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "mc/1.11.2"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"

  # --- mc/1.7.10 ---
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "mc/1.7.10"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    ignore:
      # ForgeGradle is pinned to a 1.2 -SNAPSHOT (legacy toolchain; the real
      # path forward is the RetroFuturaGradle migration).
      - dependency-name: "net.minecraftforge.gradle:ForgeGradle"
      # FG 1.2 needs an ancient Gradle; anything >=3 breaks the build.
      - dependency-name: "gradle-wrapper"
        versions: [">=3.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "mc/1.7.10"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
