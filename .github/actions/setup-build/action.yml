name: Setup build
description: JDK 25 (Temurin) + Gradle with encrypted cache for Iron Tanks CI

# Composite actions can't read the `secrets` context directly, so the caller passes
# the Gradle cache encryption key in as an input.
inputs:
  cache-encryption-key:
    description: Gradle cache encryption key (pass secrets.GRADLE_ENCRYPTION_KEY)
    required: false

  cache-read-only:
    description: |
      When 'true', the Gradle cache is read but never written.

      Defaults to "read-only unless this is a push", which deliberately overrides
      setup-gradle's own default of "writable only on the repository default branch".
      That default assumes a single-trunk repo; Iron Tanks is branch-per-Minecraft-version
      with unrelated histories and a different toolchain per line, so a cache entry written
      on the default branch is worthless to every other `mc/*` line. Each line therefore has
      to seed its own cache, which happens when a PR merges (a push to the protected `mc/*`
      branch). Pull requests stay read-only so concurrent PR jobs can't churn through the
      repo's 10 GB cache budget and evict the entries their base branch just wrote, and so
      only reviewed, merged code can populate a cache.
    required: false
    default: ${{ github.event_name != 'push' }}

runs:
  using: composite
  steps:
    - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        distribution: temurin
        java-version: '25'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      with:
        cache-encryption-key: ${{ inputs.cache-encryption-key }}
        cache-read-only: ${{ inputs.cache-read-only }}
