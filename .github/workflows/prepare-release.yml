name: Prepare Release

on:
  push:
    branches: [mc/*]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.PERSONAL_TOKEN }}
          target-branch: ${{ github.ref_name }}
