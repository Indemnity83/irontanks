name: Check PR

on:
  pull_request:
    branches: ['mc/**']
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: lint (pr)
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'

    permissions:
      pull-requests: read

    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert

          # Iron Tanks is a small, focused mod — scopes add noise without value, so they
          # are not required. A scope is still allowed if someone wants to add one.
          requireScope: false

          validateSingleCommit: false

          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            should start with a lowercase letter.

            Good:
              fix: prevent tanks from losing fluid on save
              feat: add emerald tank

            Bad:
              Fix: Prevent tanks from losing fluid on save
