name: Build (Release)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. mc26.1-v2.2.0) - produces 2.2.0+mc<version>.<loader>"
        required: true
        type: string
      publish:
        description: "Actually publish (otherwise build only)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Mapped to a job env so the "Create Sentry release" step can gate on it (secrets can't be used in `if`).
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        loader: [fabric, neoforge]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Full history so the Sentry release step can auto-associate commits.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          # Publish jobs read the cache but never write it, so a poisoned entry can't be baked into a release.
          cache-read-only: true

      - name: Extract version information
        id: version
        env:
          GH_EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MATRIX_LOADER: ${{ matrix.loader }}
        run: |
          set -euo pipefail

          if [[ "$GH_EVENT" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="$RELEASE_TAG"
          fi

          # Tag format: mc26.1-v2.2.0 (component-based for release-please tracking)
          if [[ "$TAG" =~ ^mc([0-9.]+)-v(.+)$ ]]; then
            VERSION="${BASH_REMATCH[2]}"
          else
            echo "::warning::Tag didn't match expected format: $TAG"
            VERSION="${TAG#v}"
          fi
          VERSION="${VERSION#v}"
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not resolve a version from tag: '$TAG'"
            exit 1
          fi

          # Reads exactly one non-empty "<key>=<value>" out of gradle.properties into the named
          # variable. A missing, duplicated, or empty key is a hard failure: pipefail alone only
          # catches a missing key, while "minecraft_version=" published a "3.3.2+mc.neoforge" jar.
          read_property() {
            local __var="$1" key="$2" value count
            count="$(grep -c "^${key}=" gradle.properties || true)"
            if [[ "$count" != "1" ]]; then
              echo "::error::gradle.properties must define exactly one '${key}=' entry (found ${count})"
              return 1
            fi
            value="$(grep "^${key}=" gradle.properties | cut -d'=' -f2-)"
            value="${value//[[:space:]]/}"
            if [[ -z "$value" ]]; then
              echo "::error::gradle.properties defines '${key}=' with an empty value"
              return 1
            fi
            printf -v "$__var" '%s' "$value"
          }

          version_lt() {
            [[ "$1" != "$2" && "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -n1)" == "$1" ]]
          }

          read_property MC_VERSION minecraft_version
          LOADER="$MATRIX_LOADER"

          # The stores must advertise the same range the jars declare, or store-side version filters
          # hide the mod from players on later patches of the line. Both loaders build their declared
          # range from minecraft_compatibility_versions ("<min>,<next>", min inclusive / next exclusive
          # — see the processResources blocks in fabric/build.gradle and neoforge/build.gradle), so
          # derive the published set from the same property with the same half-open semantics.
          read_property COMPAT minecraft_compatibility_versions
          COMPAT_MIN="${COMPAT%%,*}"
          COMPAT_NEXT="${COMPAT#*,}"
          if [[ "$COMPAT" != *,* || -z "$COMPAT_MIN" || -z "$COMPAT_NEXT" || "$COMPAT_NEXT" == *,* ]]; then
            echo "::error::minecraft_compatibility_versions must be formatted as '<min>,<next>' (got: '$COMPAT')"
            exit 1
          fi
          # The jar is built for minecraft_version but advertised for [min, next). If a version bump
          # moves one property and leaves the other behind, the release is advertised for every
          # version except the one it was built against — refuse to publish that combination.
          if version_lt "$MC_VERSION" "$COMPAT_MIN" || ! version_lt "$MC_VERSION" "$COMPAT_NEXT"; then
            echo "::error::minecraft_version ($MC_VERSION) is outside minecraft_compatibility_versions '>=$COMPAT_MIN <$COMPAT_NEXT'"
            exit 1
          fi
          # Character-for-character the range fabric.mod.json declares. NOTE: mc-publish expands this
          # against Mojang's version manifest at publish time and the stores then record the resulting
          # concrete list, so a release advertises only the versions that already exist when it is
          # published — patches released later are NOT backfilled onto it (issue #239).
          GAME_VERSIONS=">=${COMPAT_MIN} <${COMPAT_NEXT}"

          # SemVer build metadata distinguishes the two loader jars: 2.2.0+mc26.1.2.fabric
          FULL_VERSION="${VERSION}+mc${MC_VERSION}.${LOADER}"

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "full_version=$FULL_VERSION"
            echo "minecraft_version=$MC_VERSION"
            echo "game_versions=$GAME_VERSIONS"
            echo "loader=$LOADER"
          } >> "$GITHUB_OUTPUT"
          echo "📦 $LOADER: irontanks-$FULL_VERSION.jar (MC $MC_VERSION, published for $GAME_VERSIONS)"

      - name: Build with Gradle
        run: ./gradlew :${{ matrix.loader }}:jar --console=plain
        env:
          MOD_VERSION: ${{ steps.version.outputs.full_version }}
          # Enables Sentry source-context upload during the build (gated on the token being present).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: List build artifacts
        run: ls -lh ${{ matrix.loader }}/build/libs/

      - name: Create Sentry release
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish) && env.SENTRY_AUTH_TOKEN != '' }}
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: indmenity83
          SENTRY_PROJECT: irontanks-mod
        with:
          # Matches the runtime SDK's release: "irontanks@" + modVersion (one per loader jar).
          release: irontanks@${{ steps.version.outputs.full_version }}
          set_commits: auto
          finalize: true
          environment: production

      - name: Upload JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: irontanks-${{ steps.version.outputs.full_version }}
          path: ${{ matrix.loader }}/build/libs/irontanks-${{ steps.version.outputs.full_version }}.jar

      - name: Publish to Modrinth and CurseForge
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          loaders: ${{ matrix.loader }}
          game-versions: ${{ steps.version.outputs.game_versions }}
          # Releases ship against release versions of the game only, never snapshots. This is also
          # mc-publish's own default at the pinned SHA (action.yml: `game-version-filter: releases`);
          # stating it explicitly keeps the published set tied to the range above if that default
          # ever changes under a version bump.
          game-version-filter: releases

          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ steps.version.outputs.tag }}

          version-type: release
          name: "Iron Tanks v${{ steps.version.outputs.version }} for ${{ steps.version.outputs.loader }} ${{ steps.version.outputs.minecraft_version }}"
          version: "${{ steps.version.outputs.full_version }}"

          files: ${{ matrix.loader }}/build/libs/irontanks-${{ steps.version.outputs.full_version }}.jar

          changelog: ${{ github.event.release.body || format('Release {0}', steps.version.outputs.full_version) }}
