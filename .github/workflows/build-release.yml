name: Build (Release)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g., mc1.12.2-v2.2.0) - will produce 2.2.0+mc1.12.2 version"
        required: true
        type: string
      publish:
        description: "Actually publish (otherwise build only)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      # Java 21 runs Gradle 8.8 / RetroFuturaGradle; the Java 8 + 17 toolchains RFG
      # needs are auto-provisioned by the foojay resolver (see settings.gradle).
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Extract version information
        id: version
        env:
          GH_EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Get tag name
          if [[ "$GH_EVENT" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="$RELEASE_TAG"
          fi

          # Extract version from tag.
          # Tag format: mc1.12.2-v2.2.0 (component-based for release-please tracking)
          if [[ "$TAG" =~ ^mc([0-9.]+)-v(.+)$ ]]; then
            VERSION="${BASH_REMATCH[2]}"        # "2.2.0"
          else
            echo "::warning::Tag didn't match expected format: $TAG"
            VERSION="${TAG#v}"
          fi
          VERSION="${VERSION#v}"

          # MC version from gradle.properties (Iron Tanks is single-version Forge)
          MC_VERSION="$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)"

          # Full version with SemVer build metadata: 2.2.0+mc1.12.2
          FULL_VERSION="${VERSION}+mc${MC_VERSION}"

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "full_version=$FULL_VERSION"
            echo "minecraft_version=$MC_VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "📦 Tag: $TAG"
          echo "📦 Version: $VERSION"
          echo "📦 Built for MC: $MC_VERSION"
          echo "📦 Full version: $FULL_VERSION (passed to Gradle as MOD_VERSION)"
          echo "📦 Expected artifact: irontanks-$FULL_VERSION.jar"

      - name: Build with Gradle
        run: ./gradlew build
        env:
          MOD_VERSION: ${{ steps.version.outputs.full_version }}

      - name: List build artifacts
        run: |
          echo "📦 Build artifacts created:"
          ls -lh build/libs/

      - name: Upload JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: irontanks-${{ steps.version.outputs.full_version }}
          path: build/libs/irontanks-${{ steps.version.outputs.full_version }}.jar

      - name: Publish to Modrinth and CurseForge
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        uses: Kir-Antipov/mc-publish@995edadc13559a8b28d0b7e6571229f067ec7659 # v3.3
        with:
          loaders: forge
          game-versions: ${{ steps.version.outputs.minecraft_version }}
          dependencies: |
            buildcraft(required)

          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ steps.version.outputs.tag }}

          version-type: release
          name: "Iron Tanks v${{ steps.version.outputs.version }} for ${{ steps.version.outputs.minecraft_version }}"
          version: "${{ steps.version.outputs.full_version }}"

          files: build/libs/irontanks-${{ steps.version.outputs.full_version }}.jar

          changelog: ${{ github.event.release.body || format('Release {0}', steps.version.outputs.full_version) }}
