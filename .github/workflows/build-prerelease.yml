name: Build (Pre-release)

on:
  workflow_dispatch:
    inputs:
      number:
        description: "Pre-release number (1, 2, 3...)"
        required: true
        default: "1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Mapped to a job env so the "Create Sentry release" step can gate on it (secrets can't be used in `if`).
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        loader: [fabric, neoforge]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          # Publish jobs read the cache but never write it, so a poisoned entry can't be baked into a release.
          cache-read-only: true

      - name: Extract version information
        id: version
        env:
          INPUT_NUMBER: ${{ inputs.number }}
          MATRIX_LOADER: ${{ matrix.loader }}
        run: |
          set -euo pipefail

          BASE_VERSION="$(jq -r '."."' .release-please-manifest.json)"
          if [[ -z "$BASE_VERSION" || "$BASE_VERSION" == "null" ]]; then
            echo "Failed to resolve BASE_VERSION from .release-please-manifest.json" >&2
            exit 1
          fi

          NUMBER="$INPUT_NUMBER"
          [[ "$NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid number: must be a positive integer"; exit 1; }
          PRE_VERSION="${BASE_VERSION}-pre.${NUMBER}"

          MC_VERSION="$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)"
          LOADER="$MATRIX_LOADER"
          FULL_VERSION="${PRE_VERSION}+mc${MC_VERSION}.${LOADER}"

          [[ "$LOADER" == "neoforge" ]] && LOADER_SHORT="n" || LOADER_SHORT="f"
          MODRINTH_VERSION="${PRE_VERSION}+mc${MC_VERSION}.${LOADER_SHORT}"
          (( ${#MODRINTH_VERSION} > 32 )) && MODRINTH_VERSION="${MODRINTH_VERSION:0:32}"

          {
            echo "pre_version=$PRE_VERSION"
            echo "modrinth_version=$MODRINTH_VERSION"
            echo "full_version=$FULL_VERSION"
            echo "minecraft_version=$MC_VERSION"
            echo "loader=$LOADER"
          } >> "$GITHUB_OUTPUT"
          echo "📦 Building $FULL_VERSION"

      - name: Build with Gradle
        run: ./gradlew :${{ matrix.loader }}:jar --console=plain
        env:
          MOD_VERSION: ${{ steps.version.outputs.full_version }}
          # Enables Sentry source-context upload during the build (gated on the token being present).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Create Sentry release
        if: ${{ env.SENTRY_AUTH_TOKEN != '' }}
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: indmenity83
          SENTRY_PROJECT: irontanks-mod
        with:
          release: irontanks@${{ steps.version.outputs.full_version }}
          set_commits: auto
          finalize: true
          # Pre-releases (betas) stay out of the production deploy stream.
          environment: preview

      - name: Upload JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: irontanks-${{ steps.version.outputs.full_version }}
          path: ${{ matrix.loader }}/build/libs/irontanks-${{ steps.version.outputs.full_version }}.jar

      - name: Publish to Modrinth and CurseForge
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          loaders: ${{ matrix.loader }}
          game-versions: ${{ steps.version.outputs.minecraft_version }}
          # Pre-releases target whatever MC version (incl. pre-releases/snapshots) the branch builds
          # against, so there's nothing to filter to "releases". mc-publish defaults this to "releases",
          # which would drop a pre-release game version and fail the upload — so force it off.
          game-version-filter: none

          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-version: ${{ steps.version.outputs.modrinth_version }}

          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          version-type: beta
          version: ${{ steps.version.outputs.full_version }}
          name: "Iron Tanks v${{ steps.version.outputs.pre_version }} for ${{ steps.version.outputs.loader }} ${{ steps.version.outputs.minecraft_version }}"

          files: ${{ matrix.loader }}/build/libs/irontanks-${{ steps.version.outputs.full_version }}.jar
