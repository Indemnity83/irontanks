// Pure-logic module: tank tiers, fluid-stacking math, void rate, upgrade rules.
// Deliberately a plain java-library — NO Minecraft, Loom or ModDevGradle here, so this code is
// fully unit-testable without a game running. Each loader depends on it via project(':core').
plugins {
    id 'java-library'
    id 'jacoco'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(rootProject.java_version.toInteger())
    withSourcesJar()
}

// JaCoCo 0.8.14 is the first release that officially supports Java 25 bytecode (class major v69);
// Gradle's bundled default is older and would fail to instrument. Bump in lockstep with java_version.
jacoco {
    toolVersion = rootProject.jacoco_version
}

repositories {
    mavenCentral()
}

dependencies {
    // Crash reporting (com.indemnity83.irontanks.core.crash). All three are provided at runtime —
    // Sentry by each loader's jar-in-jar bundle, Gson + Log4j2 by Minecraft — so they are compileOnly
    // here (never bundled by core) and testImplementation so the pure-logic tests can exercise them.
    compileOnly "io.sentry:sentry:${rootProject.sentry_version}"
    compileOnly "com.google.code.gson:gson:${rootProject.gson_version}"
    compileOnly "org.apache.logging.log4j:log4j-core:${rootProject.log4j_version}"
    compileOnly "org.slf4j:slf4j-api:${rootProject.slf4j_version}"

    testImplementation platform("org.junit:junit-bom:${rootProject.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "org.assertj:assertj-core:${rootProject.assertj_version}"
    testImplementation "io.sentry:sentry:${rootProject.sentry_version}"
    testImplementation "com.google.code.gson:gson:${rootProject.gson_version}"
    testImplementation "org.apache.logging.log4j:log4j-core:${rootProject.log4j_version}"
    testRuntimeOnly "org.slf4j:slf4j-api:${rootProject.slf4j_version}"
}

test {
    useJUnitPlatform()
    // Block drops and mining tags are pure data in the shared /resources pack, so the pure-logic
    // tests validate them too. Point them at the pack rather than leaving them to guess a path.
    systemProperty 'irontanks.resources.dir', rootProject.file('resources').absolutePath
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
    finalizedBy jacocoTestReport
}

// XML report is what Codecov consumes; HTML is handy for local inspection.
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}
