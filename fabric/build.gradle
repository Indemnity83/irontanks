// Fabric loader module. Depends on the pure-logic :core and embeds its classes in the mod jar
// (core is a plain library, not a separate mod, so it is not loaded as its own jar at runtime).
plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom'
    id 'io.sentry.jvm.gradle'
}

base {
    archivesName = rootProject.archives_base_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(rootProject.java_version.toInteger())
    withSourcesJar()
}

repositories {
    mavenCentral()
    // Jade is published on the Modrinth maven (optional HUD integration below).
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "irontanks" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"
    implementation project(':core')

    // Optional logistics integration: compile against the published logistics mod from the Modrinth maven
    // (Mojang-mapped, no remapping needed — same pattern as Jade below). compileOnly + a runtime
    // class-presence gate means the logistics API classes are only linked when logistics is installed, and
    // nothing is bundled. Version pinned in gradle.properties.
    compileOnly "maven.modrinth:logistics:${rootProject.logistics_version}.fabric"

    // Dev-only: load the full logistics mod in runClient so cross-mod tank stacking and upgrades can be
    // exercised. This 26.1 toolchain is Mojang-mapped end to end (same reason Jade below uses plain client*
    // configs), so no Loom mod-remap config is needed: a plain runtimeOnly puts the jar on the run classpath
    // where Fabric Loader discovers it and applies its access widener.
    runtimeOnly "maven.modrinth:logistics:${rootProject.logistics_version}.fabric"

    // Optional Jade HUD integration: compile-only, on the client source set where the @WailaPlugin class
    // lives. The 26.1 Fabric toolchain is Mojang-mapped (as is Jade's jar), so no remapping is needed and
    // a plain clientCompileOnly suffices. The class only loads when Jade is actually installed.
    clientCompileOnly "maven.modrinth:jade:${rootProject.jade_fabric_version}"
    // Dev-only: load Jade in runClient so the HUD integration can actually be exercised. runtimeOnly (not
    // include), so it is not bundled in the shipped jar and Jade stays optional in production.
    clientRuntimeOnly "maven.modrinth:jade:${rootProject.jade_fabric_version}"

    // Sentry crash-reporting SDK. core uses it but doesn't bundle it (its dep is compileOnly), so the
    // loader supplies it: implementation puts it on the dev runtime classpath, include nests it
    // jar-in-jar for shipped builds. Gson/Log4j2 that core also needs are provided by Minecraft.
    implementation "io.sentry:sentry:${rootProject.sentry_version}"
    include "io.sentry:sentry:${rootProject.sentry_version}"
}

// Embed the pure-logic core classes directly into the mod jar.
tasks.named('jar') {
    from(project(':core').sourceSets.main.output)
}

// Shared assets + data (blockstates, models, textures, recipes, lang) live in /resources and
// are folded into this loader's resource output, so they reach both the mod jar and the dev resource
// root. Loader-specific resources (fabric.mod.json) stay in this module's own resources.
sourceSets.main.resources.srcDir(rootProject.file('resources'))

processResources {
    def bounds = rootProject.minecraft_compatibility_versions.split(',').collect { it.trim() }
    if (bounds.size() != 2 || bounds.any { it.isEmpty() }) {
        throw new GradleException("minecraft_compatibility_versions must be formatted as '<min>,<next>'")
    }
    var props = [
        version                       : project.version,
        minecraft_version             : rootProject.minecraft_version,
        fabric_minecraft_version_range: ">=${bounds[0]} <${bounds[1]}",
        fabric_loader_version         : rootProject.fabric_loader_version,
        fabric_version                : rootProject.fabric_version,
        java_version                  : rootProject.java_version,
    ]
    inputs.properties(props)
    filesMatching('fabric.mod.json') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = rootProject.java_version.toInteger()
}

// Sentry source-context upload (so stack traces show inline source in Sentry). Gated on the
// SENTRY_AUTH_TOKEN secret: local/PR builds without it skip the upload entirely and never fail.
// We manage the SDK dependency ourselves above, so the plugin's auto-install/telemetry stay off.
def sentryAuthToken = System.getenv("SENTRY_AUTH_TOKEN")
sentry {
    includeSourceContext = sentryAuthToken != null && !sentryAuthToken.isEmpty()
    org = "indmenity83"
    projectName = "irontanks-mod"
    authToken = sentryAuthToken
    autoInstallation {
        enabled = false
    }
    telemetry = false
}

// The Sentry plugin emits generated metadata into the main resources, which withSourcesJar() also
// picks up; declare the dependency so Gradle 9 doesn't reject the implicit one on `build`.
tasks.named('sourcesJar') {
    dependsOn(tasks.matching {
        it.name.toLowerCase().startsWith('generatesentry') || it.name == 'collectExternalDependenciesForSentry'
    })
}
